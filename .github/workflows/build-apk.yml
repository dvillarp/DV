name: Build WIMC APK

on:
  push:
    branches: [wimc-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (plataforma + build-tools)
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK (release firmado)
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Guardar el registro de compilación en la rama wimc-log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logout && cp build.log /tmp/logout/build.log 2>/dev/null || echo "sin log" > /tmp/logout/build.log
          grep -nE "^e: |error:|What went wrong|Unresolved|FAILED|Execution failed|Could not" build.log | head -80 > /tmp/logout/errores.txt || true
          cd /tmp/logout
          git init -q -b wimc-log
          git config user.name "wimc-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" wimc-log

      - name: Preparar APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk WIMC-DV.apk

      - name: Huella SHA-1 de la firma (para restringir la clave de Maps)
        shell: bash
        run: |
          keytool -list -v -keystore app/dv-wimc.jks -storepass dvwimc123 | grep -E "SHA1|SHA256" | tee sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WIMC-DV-apk
          path: |
            WIMC-DV.apk
            sha.txt

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wimc-${{ github.run_number }}
          name: WIMC DV (build ${{ github.run_number }})
          body: "APK firmado de WIMC (Where Is My Car) DV. Instálalo encima de la versión anterior."
          files: WIMC-DV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
