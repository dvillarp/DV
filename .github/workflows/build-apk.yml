name: Build WIMC APK

on:
  push:
    branches: [wimc-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (plataforma + build-tools)
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK (release firmado)
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Preparar APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk WIMC-DV.apk

      - name: Huella SHA-1 de la firma (para restringir la clave de Maps)
        shell: bash
        run: |
          keytool -list -v -keystore app/dv-wimc.jks -storepass dvwimc123 | grep -E "SHA1|SHA256" | tee sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WIMC-DV-apk
          path: |
            WIMC-DV.apk
            sha.txt

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wimc-${{ github.run_number }}
          name: WIMC DV (build ${{ github.run_number }})
          body: "APK firmado de WIMC (Where Is My Car) DV. Instálalo encima de la versión anterior."
          files: WIMC-DV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
