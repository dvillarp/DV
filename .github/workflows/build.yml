name: WIMC DV - APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear android si falta
        run: |
          flutter config --no-analytics
          flutter config --enable-android
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org=com.dv.app --project-name=dv
          fi

      - name: Fix compileSdk 34+ (geocoding necesita 34+)
        run: |
          echo "Actualizando compileSdk a 36..."
          sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk 33/compileSdk 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk 34/compileSdk 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk = 33/compileSdk = 36/g' android/local.properties || true
          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 36/g' android/app/build.gradle || true
          # Para Flutter 3.22+ usa flutter.compileSdkVersion
          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle | grep -n compileSdk || true
          fi
          # Tambien actualizar local.properties si existe
          if [ -f android/local.properties ]; then
            echo "flutter.compileSdkVersion=36" >> android/local.properties
            echo "flutter.targetSdkVersion=36" >> android/local.properties
          fi

      - name: Dependencias
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK WIMC REAL
        run: flutter build apk --release --verbose

      - name: Publicar APK WIMC DV
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wimc-v${{ github.run_number }}
          name: WIMC DV v${{ github.run_number }} - APK LISTO
          body: |
            DV WIMC - Where Is My Car - APK listo para instalar
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
