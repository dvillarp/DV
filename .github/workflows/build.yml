name: Compilar DV - EXE y APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true
      - name: Crear carpetas Android y Windows si faltan
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          if (-not (Test-Path "android")) {
            flutter create . --platforms=android,windows --org=com.dv.app --project-name=dv --overwrite
          }
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build windows --release
      - name: ZIP
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DV-Windows.zip -Force
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: DV v${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            DV-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
