name: Compilar DV - EXE y APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true
      - name: Configurar Flutter
        run: |
          flutter config --no-analytics
          flutter config --enable-windows-desktop
          flutter --version
      - name: Instalar dependencias
        run: flutter pub get
      - name: Compilar APK
        run: flutter build apk --release --verbose
      - name: Compilar Windows EXE
        run: flutter build windows --release --verbose
      - name: Crear ZIP Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DV-Windows.zip -Force
      - name: Publicar Release con links
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: DV v${{ github.run_number }} - LISTO
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            DV-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
