name: DV WIMC V1 - BUILD FINAL OK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: RECREAR ANDROID LIMPIO
        run: |
          flutter config --no-analytics
          rm -rf android
          flutter create . --platforms=android --org=com.dv.app --project-name=dv
      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wimc-v1-${{ github.run_number }}
          name: DV WIMC V1 - APK LISTO
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
