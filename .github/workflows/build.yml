name: Compilar DV - EXE y APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      - name: Crear proyecto si falta
        shell: pwsh
        run: |
          if (-not (Test-Path "lib/main.dart")) {
            Write-Host "Creando proyecto Flutter..."
            flutter create . --platforms=android,windows --org=com.dv.app --project-name=dv --no-pub --overwrite
          }

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build windows --release

      - name: Crear paquetes
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DV-Windows.zip -Force
          $bat = @'
          @echo off
          echo === Instalador DV ===
          powershell -Command "Expand-Archive -Path DV-Windows.zip -DestinationPath .\DV-App -Force"
          start .\DV-App\dv.exe
          '@
          Set-Content -Path instalador-DV.bat -Value $bat -Encoding ascii

      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: DV v${{ github.run_number }} - LISTO
          body: |
            Descargas listas para instalar:
            - Android: app-release.apk
            - Windows: DV-Windows.zip
            - Instalador: instalador-DV.bat
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            DV-Windows.zip
            instalador-DV.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
