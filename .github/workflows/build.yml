name: WIMC DV - APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear android si falta
        run: |
          flutter config --no-analytics
          flutter config --enable-android
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org=com.dv.app --project-name=dv
          fi

      - name: Dependencias
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK WIMC REAL
        run: flutter build apk --release

      - name: Publicar APK WIMC DV
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wimc-v${{ github.run_number }}
          name: WIMC DV v${{ github.run_number }} - APK LISTO
          body: |
            DV WIMC - Where Is My Car
            1 boton GUARDAR, 1 boton LLEVAME a Google Maps
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
